###############################################################################
# Hypridle Configuration
# Author: Man37
# Handles idle actions, lock screen, and session behavior
###############################################################################

general {
    lock_cmd            = pidof hyprlock || hyprlock
    unlock_cmd           = pkill -USR1 hyprlock          # optional: signal hyprlock to unlock UI immediately
    before_sleep_cmd    = loginctl lock-session
    after_sleep_cmd     = hyprctl dispatch dpms on
    ignore_dbus_inhibit = true                            # test with this ON first to rule out flapping inhibitors
}

# ── LISTENER 1: Idle Warning ────────────────────────────────────────────────
listener {
    timeout     = 540
    on-timeout  = notify-send -u normal -t 5000 "Idle Warning" "You are idle!"
    on-resume   = notify-send -u normal -t 3000 "Welcome back" "Welcome back, man37!"
}

# ── LISTENER 2: Auto-Lock ───────────────────────────────────────────────────
listener {
    timeout     = 600
    on-timeout  = loginctl lock-session
    on-resume   = hyprctl dispatch dpms on                # ensure screen wakes on resume too
}
